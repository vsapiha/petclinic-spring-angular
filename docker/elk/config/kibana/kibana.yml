xpack.fleet:
    isAirGapped: false
    agents:
        enabled: true
# https://www.elastic.co/docs/reference/kibana/configuration-reference/fleet-settings#_fleet_settings
# openssl x509 -fingerprint -sha256 -noout -in elk/certificates/certs/ca/root-ca.crt | awk -F"=" {' print $2 '} | sed s/://g | base64
