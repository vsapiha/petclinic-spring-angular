#        fleet_server.hosts: ["https://fleet-server:8220"]
#        elasticsearch:
#            hosts: ["https://es01:9200"]
#            ca_sha256: QUVERkVDRDZGNTU1QTdBQUQ1NUE2NzYzNTIwMzdBNTk0QTM1NUIxQkIwRDhENDc0NTYwQkZENDBFRTM5RTdDOQo=

# https://www.elastic.co/docs/reference/kibana/configuration-reference/fleet-settings#_preconfiguration_settings_for_advanced_use_cases
    packages:
    -   name: apm
        version: latest
    -   name: fleet_server
        version: latest
#    -   name: elastic_agent
#        version: latest
#    -   name: system
#        version: latest
#    -   name: docker
#        version: latest

    agentPolicies:
    -   name: Default Fleet Server policy
        description: Fleet server policy with APM and System logs and metrics enabled
        id: default-policy

        is_default: false
        is_managed: true
        is_default_fleet_server: false

        namespace: default
        monitoring_enabled:
            - logs
            - metrics

        package_policies:
            -   name: Fleet Server
                id: fleet-server
                package:
                    name: fleet_server
                inputs:
                    -   type: fleet-server
                        keep_enabled: true
                        vars:
                            -   name: host
                                value: 0.0.0.0
                                frozen: true
                            -   name: port
                                value: 8220
                                frozen: true

            -   name: Elastic APM
                id: apm-server
                package:
                    name: apm
                inputs:
                    -   type: apm
                        keep_enabled: true
                        vars:
                            -   name: host
                                value: "0.0.0.0:8200"
                                frozen: true
                            -   name: url
                                value: "http://0.0.0.0:8200"
                                frozen: true
#                            -   name: api_key_enabled
#                                value: true
#                            -   name: secret_token
#                                value: "pe!eoe@8"
                            -   name: enable_rum
                                value: true
                                frozen: true

